<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Match Day Roster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --pitch-deep:#12312A;
    --pitch:#1B4D3E;
    --pitch-stripe:#194533;
    --line:#EAF2ED;
    --chalk:#F5F7F2;
    --gold:#E8B923;
    --slate:#42545A;
    --slate-light:#7C8B8F;
    --ink:#0F1D18;
    --danger:#C1462F;
    --card:#FFFFFF;
    --bg:#EEF1EC;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;}
  body{padding-bottom:88px;}
  h1,h2,h3,.display{font-family:'Anton',sans-serif; font-weight:400; letter-spacing:0.02em; text-transform:uppercase;}
  #app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;}

  header.topbar{
    background:var(--pitch-deep);
    color:var(--chalk);
    padding:22px 20px 18px;
    border-bottom:3px solid var(--gold);
  }
  header.topbar .eyebrow{font-size:11px;letter-spacing:0.18em;color:var(--gold);font-weight:700;text-transform:uppercase;}
  header.topbar h1{font-size:26px;margin:2px 0 0;color:var(--chalk);}

  .sticky-top{position:sticky;top:0;z-index:20;}
  nav.tabs{display:flex;background:var(--pitch);}
  nav.tabs button{
    flex:1;background:none;border:none;color:var(--chalk);opacity:0.65;
    font-family:'Inter';font-weight:700;font-size:12.5px;letter-spacing:0.05em;text-transform:uppercase;
    padding:12px 4px;cursor:pointer;border-bottom:3px solid transparent;
  }
  nav.tabs button.active{opacity:1;border-bottom-color:var(--gold);}

  main{padding:16px;}
  .card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 1px 2px rgba(15,29,24,0.06);}
  .card h2{font-size:18px;margin:0 0 12px;color:var(--pitch-deep);}
  .muted{color:var(--slate-light);font-size:13px;line-height:1.5;}
  label.field-label{display:block;font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--slate);margin:0 0 6px;}
  input[type=text], input[type=date], select{
    width:100%;border:1.5px solid #D8DEDA;border-radius:9px;padding:10px 12px;font-size:16px;font-family:'Inter';
    background:#FBFCFA;color:var(--ink);
  }
  input:focus, select:focus{outline:none;border-color:var(--pitch);}
  .row{display:flex;gap:8px;align-items:center;}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    background:var(--pitch);color:var(--chalk);border:none;border-radius:10px;
    padding:11px 16px;font-weight:700;font-size:14px;letter-spacing:0.02em;cursor:pointer;
  }
  .btn:active{transform:scale(0.98);}
  .btn.secondary{background:#E4E9E4;color:var(--pitch-deep);}
  .btn.gold{background:var(--gold);color:var(--pitch-deep);}
  .btn.danger{background:none;color:var(--danger);padding:6px 8px;font-size:13px;}
  .btn.full{width:100%;}
  .btn:disabled{opacity:0.4;}

  .player-chip{
    display:flex;align-items:center;justify-content:space-between;
    background:#F6F8F5;border:1.5px solid #E4E9E4;border-radius:10px;
    padding:10px 12px;margin-bottom:8px;
  }
  .player-chip .name{font-weight:600;font-size:15px;}
  .attend-row{display:flex;align-items:center;justify-content:space-between;padding:9px 2px;border-bottom:1px solid #EEF1EC;}
  .attend-row:last-child{border-bottom:none;}
  .toggle{
    width:44px;height:26px;border-radius:20px;background:#D8DEDA;position:relative;cursor:pointer;flex-shrink:0;transition:background 0.15s;
  }
  .toggle.on{background:var(--pitch);}
  .toggle .knob{position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:white;transition:left 0.15s;box-shadow:0 1px 2px rgba(0,0,0,0.25);}
  .toggle.on .knob{left:20px;}

  .stepper{display:flex;align-items:center;gap:14px;}
  .stepper button{width:36px;height:36px;border-radius:9px;border:1.5px solid #D8DEDA;background:#FBFCFA;font-size:18px;font-weight:700;cursor:pointer;color:var(--pitch-deep);}
  .stepper .val{font-family:'Anton';font-size:22px;min-width:24px;text-align:center;color:var(--pitch-deep);}

  .pitch-wrap{background:var(--pitch);border-radius:14px;padding:14px;position:relative;overflow:hidden;}
  .pitch-wrap svg{display:block;width:100%;height:auto;}
  .bubble-label{font-family:'Inter';font-weight:800;font-size:10.5px;fill:var(--pitch-deep);}
  .bubble-pos{font-family:'Inter';font-weight:600;font-size:6.5px;letter-spacing:0.06em;fill:var(--slate);}
  .bubble-name{font-family:'Inter';font-weight:800;font-size:6.2px;fill:var(--pitch-deep);}
  .bubble-pos-sm{font-family:'Inter';font-weight:600;font-size:4.4px;letter-spacing:0.05em;fill:var(--slate);}

  .bench-strip{margin-top:10px;padding:12px;background:#EDF3EC;border-radius:12px;}
  .bench-strip .lbl{font-size:11px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:var(--slate);margin-bottom:8px;}
  .bench-chips{display:flex;flex-wrap:wrap;gap:6px;}
  .bench-chip{background:var(--card);border:1.5px solid #D8DEDA;border-radius:20px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--slate);}

  .shift-tabs{display:flex;gap:6px;margin:14px 0 10px;flex-wrap:wrap;}
  .shift-tabs button{
    border:1.5px solid #D8DEDA;background:var(--card);border-radius:8px;padding:8px 12px;
    font-weight:700;font-size:12.5px;cursor:pointer;color:var(--slate);
  }
  .shift-tabs button.active{background:var(--pitch);color:var(--chalk);border-color:var(--pitch);}
  .half-header{display:flex;align-items:center;justify-content:space-between;margin:18px 0 4px;}
  .half-header h3{font-size:15px;margin:0;color:var(--pitch-deep);}
  .gk-note{font-size:12px;color:var(--slate-light);}

  .game-list-item{display:flex;align-items:center;justify-content:space-between;padding:13px 4px;border-bottom:1px solid #EEF1EC;cursor:pointer;}
  .game-list-item:last-child{border-bottom:none;}
  .game-list-item .date{font-weight:700;font-size:15px;color:var(--pitch-deep);}
  .game-list-item .sub{font-size:12.5px;color:var(--slate-light);}

  .empty-state{text-align:center;padding:36px 16px;color:var(--slate-light);}
  .empty-state .display{font-size:20px;color:var(--pitch-deep);margin-bottom:6px;}

  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--pitch-deep);color:var(--chalk);padding:11px 20px;border-radius:30px;
    font-size:13.5px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,0.2);z-index:50;
    max-width:88%;text-align:center;
  }
  .warn-banner{background:#FCEFE9;border:1.5px solid #F0C4B0;color:var(--danger);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px;}
  .swap-hint{font-size:12px;color:var(--slate-light);margin:6px 2px 0;}
  .selected-for-swap{outline:2.5px solid var(--gold);outline-offset:1px;}

  .rt-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  table.rt-table{border-collapse:collapse;width:100%;font-size:12.5px;}
  table.rt-table th, table.rt-table td{padding:7px 8px;text-align:center;border-bottom:1px solid #EEF1EC;white-space:nowrap;}
  table.rt-table th{color:var(--slate);font-size:10.5px;text-transform:uppercase;letter-spacing:0.04em;font-weight:800;}
  table.rt-table td.rt-name, table.rt-table th.rt-name{text-align:left;font-weight:700;color:var(--pitch-deep);position:sticky;left:0;background:var(--card);}

  .theme-row{display:flex;gap:10px;flex-wrap:wrap;}
  .theme-swatch{width:36px;height:36px;border-radius:50%;border:2.5px solid #E4E9E4;cursor:pointer;padding:0;}
  .theme-swatch.selected{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset, 0 0 0 1px var(--gold);}

  .score-big{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:14px;}
  .score-side{text-align:center;flex:1;}
  .score-label{font-size:12px;font-weight:700;color:var(--slate);text-transform:uppercase;letter-spacing:0.04em;margin-bottom:2px;}
  .score-num{font-family:'Anton';font-size:44px;color:var(--pitch-deep);line-height:1;}
  .score-sep{font-family:'Anton';font-size:30px;color:var(--slate-light);}
  .goal-row{display:flex;align-items:center;justify-content:space-between;padding:9px 2px;border-bottom:1px solid #EEF1EC;font-size:14px;font-weight:600;}
  .goal-row:last-child{border-bottom:none;}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast" style="display:none;"></div>
<script>
/* ---------- Storage helpers ----------
   Uses Claude's cloud storage when this app is viewed inside Claude.
   Falls back to the browser's own localStorage when opened as a
   standalone file (e.g. tapped open directly in Safari or Chrome),
   since window.storage only exists inside Claude's artifact host. */
const CLOUD = (typeof window.storage !== 'undefined' && window.storage);

async function storageGet(key){
  if(CLOUD){
    try{ const r = await window.storage.get(key, false); return r ? r.value : null; }
    catch(e){ return null; }
  }
  try{ return localStorage.getItem(key); }catch(e){ return null; }
}
async function storageSet(key, value){
  if(CLOUD){
    try{ await window.storage.set(key, value, false); return true; }catch(e){ return false; }
  }
  try{ localStorage.setItem(key, value); return true; }catch(e){ return false; }
}
async function loadRoster(){
  const v = await storageGet('roster');
  try{ return v ? JSON.parse(v) : []; }catch(e){ return []; }
}
async function saveRoster(list){ await storageSet('roster', JSON.stringify(list)); }
async function loadGames(){
  const v = await storageGet('games');
  try{ return v ? JSON.parse(v) : {}; }catch(e){ return {}; }
}
async function saveGames(obj){ await storageSet('games', JSON.stringify(obj)); }
async function loadSettings(){
  const v = await storageGet('settings');
  try{ return v ? JSON.parse(v) : { teamName:'', theme:'green' }; }catch(e){ return { teamName:'', theme:'green' }; }
}
async function saveSettings(obj){ await storageSet('settings', JSON.stringify(obj)); }

/* ---------- App state ---------- */
const State = {
  tab: 'roster',
  players: [],
  games: {},
  settings: { teamName: '', theme: 'green' },
  loaded: false,
  // new-game draft
  draft: null,
  activeGameDate: null, // when viewing a saved game
  viewingHalf: 0,
  viewingShift: 0,
  swapSelection: null,
  showScorerPicker: false,
};

const POSITION_SLOTS = [
  {code:'D1', label:'Defender', short:'D', zone:'Defense'},
  {code:'D2', label:'Defender', short:'D', zone:'Defense'},
  {code:'M',  label:'Midfielder', short:'M', zone:'Midfield'},
  {code:'W1', label:'Wing', short:'W', zone:'Attack'},
  {code:'W2', label:'Wing', short:'W', zone:'Attack'},
  {code:'F',  label:'Forward', short:'F', zone:'Attack'},
];

const THEMES = {
  green:  { name:'Forest Green', pitchDeep:'#12312A', pitch:'#1B4D3E', pitchStripe:'#194533', gold:'#E8B923' },
  blue:   { name:'Dragon Blue',  pitchDeep:'#0D2A45', pitch:'#164C78', pitchStripe:'#124066', gold:'#F2C230' },
  red:    { name:'Crimson',      pitchDeep:'#3D0F16', pitch:'#7A1B2C', pitchStripe:'#661722', gold:'#E8B923' },
  purple: { name:'Royal Purple', pitchDeep:'#211039', pitch:'#3D1B6B', pitchStripe:'#331759', gold:'#E8B923' },
  orange: { name:'Sunset Orange',pitchDeep:'#5C2A0C', pitch:'#B4501B', pitchStripe:'#984318', gold:'#2E4D3D' },
  slate:  { name:'Slate Gray',   pitchDeep:'#1E262B', pitch:'#3C4C56', pitchStripe:'#334148', gold:'#E8B923' },
};

function applyTheme(key){
  const t = THEMES[key] || THEMES.green;
  const root = document.documentElement.style;
  root.setProperty('--pitch-deep', t.pitchDeep);
  root.setProperty('--pitch', t.pitch);
  root.setProperty('--pitch-stripe', t.pitchStripe);
  root.setProperty('--gold', t.gold);
}

function uid(){ return Math.random().toString(36).slice(2,9); }
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function playerName(id){
  const p = State.players.find(p=>p.id===id);
  if(!p) return '—';
  return p.lastInitial ? (p.name + ' ' + p.lastInitial.toUpperCase() + '.') : p.name;
}
function playerInitials(id){
  const p = State.players.find(p=>p.id===id);
  if(!p) return '?';
  const first = (p.name[0]||'?').toUpperCase();
  const second = p.lastInitial ? p.lastInitial[0].toUpperCase() : (p.name[1]||'').toUpperCase();
  return first + second;
}
function pitchDisplayLabel(id){
  const p = State.players.find(p=>p.id===id);
  if(!p) return '?';
  let first = p.name.length > 6 ? p.name.slice(0,6) : p.name;
  return p.lastInitial ? (first + ' ' + p.lastInitial.toUpperCase() + '.') : first;
}

let toastTimer = null;
function showToast(msg){
  const el = document.getElementById('toast');
  if(!el) return;
  el.textContent = msg;
  el.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ el.style.display = 'none'; }, 2000);
}

/* ---------- Rotation engine ---------- */
const SLOT_CATEGORIES = ['Defender','Defender','Midfielder','Wing','Wing','Forward'];
const ALL_CODES = ['D1','D2','M','W1','W2','F'];

/* Greedy min-cost matching: pair each given player with one of the given
   slot codes, favoring whichever category that player has played LEAST so
   far this game, and lightly penalizing repeating their immediately-previous
   category. Works for a full 6-code assignment or a partial one (just the
   codes that need refilling). */
function assignPlayersToCodes(playerIds, codes, state){
  const pairs = [];
  playerIds.forEach(pid=>{
    codes.forEach(code=>{
      const cat = POS_CATEGORY[code];
      const cnt = state[pid].categoryCounts[cat];
      const repeatPenalty = state[pid].lastCategory === cat ? 5 : 0;
      pairs.push({ pid, code, cost: cnt*10 + repeatPenalty + Math.random() });
    });
  });
  pairs.sort((a,b)=> a.cost - b.cost);
  const usedPlayers = new Set(), usedCodes = new Set();
  const assign = {};
  pairs.forEach(pair=>{
    if(usedPlayers.has(pair.pid) || usedCodes.has(pair.code)) return;
    assign[pair.code] = pair.pid;
    usedPlayers.add(pair.pid);
    usedCodes.add(pair.code);
  });
  return assign;
}

function generateGameSchedule(presentIds, gkHalf1, gkHalf2, shiftsPerHalf){
  const present = presentIds.map(id=>({id}));
  const state = {};
  present.forEach(p=> state[p.id] = {
    shiftsPlayed: 0,
    consecutiveOnField: 0,
    lastCategory: null,
    categoryCounts: { Defender:0, Midfielder:0, Wing:0, Forward:0 },
  });

  const halfDefs = [ {gk:gkHalf1}, {gk:gkHalf2} ];
  const halves = [];

  halfDefs.forEach(hd=>{
    const gkId = hd.gk;
    const fieldEligible = present.filter(p=>p.id!==gkId);
    const shifts = [];
    const cap = shiftsPerHalf >= 3 ? 2 : 1;
    let currentAssign = null; // { slotCode: playerId } carried from the previous shift

    for(let s=0; s<shiftsPerHalf; s++){
      let assign, benchedIds;

      if(!currentAssign){
        // First shift of the half: pick the 6 with least total field time so far.
        const pool = shuffle(fieldEligible.slice()).sort((a,b)=> state[a.id].shiftsPlayed - state[b.id].shiftsPlayed);
        const onFieldIds = pool.slice(0,6).map(p=>p.id);
        assign = assignPlayersToCodes(onFieldIds, ALL_CODES.slice(), state);
        benchedIds = fieldEligible.map(p=>p.id).filter(pid=> !onFieldIds.includes(pid));
      } else {
        // Later shifts: anyone under the consecutive-shift cap KEEPS their exact
        // slot. Only players who've hit the cap get substituted out, and only
        // their specific vacated slots get refilled from the bench.
        const stayers = {};
        let vacatedCodes = [];
        Object.entries(currentAssign).forEach(([code,pid])=>{
          if(state[pid].consecutiveOnField >= cap) vacatedCodes.push(code);
          else stayers[code] = pid;
        });

        const stayerIds = Object.values(stayers);
        const vacatingIds = Object.values(currentAssign).filter(pid=> !stayerIds.includes(pid));
        const benchPool = fieldEligible.filter(p=> !stayerIds.includes(p.id) && !vacatingIds.includes(p.id));
        // If there aren't enough bench players to fill every vacancy (can happen
        // with a very small roster), keep the extra players on rather than drop
        // a position entirely.
        if(vacatedCodes.length > benchPool.length){
          const revert = vacatedCodes.slice(benchPool.length);
          vacatedCodes = vacatedCodes.slice(0, benchPool.length);
          revert.forEach(code=>{ stayers[code] = currentAssign[code]; });
        }

        const benchSorted = shuffle(benchPool.slice()).sort((a,b)=> state[a.id].shiftsPlayed - state[b.id].shiftsPlayed);
        const incomingIds = benchSorted.slice(0, vacatedCodes.length).map(p=>p.id);
        const incomingAssign = assignPlayersToCodes(incomingIds, vacatedCodes, state);

        assign = Object.assign({}, stayers, incomingAssign);
        const onFieldIds = Object.values(assign);
        benchedIds = fieldEligible.map(p=>p.id).filter(pid=> !onFieldIds.includes(pid));
      }

      Object.entries(assign).forEach(([code,pid])=>{
        state[pid].shiftsPlayed++;
        state[pid].consecutiveOnField++;
        const cat = POS_CATEGORY[code];
        state[pid].categoryCounts[cat]++;
        state[pid].lastCategory = cat;
      });
      benchedIds.forEach(pid=>{ state[pid].consecutiveOnField = 0; });

      shifts.push({ assign, benched: benchedIds });
      currentAssign = assign;
    }
    fieldEligible.forEach(p=> state[p.id].consecutiveOnField = 0);
    halves.push({ gkId, shifts });
  });

  return halves;
}

/* ---------- Rendering ---------- */
function render(){
  document.title = State.settings.teamName ? (State.settings.teamName + ' — Roster') : 'Match Day Roster';
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="sticky-top">
      ${headerHtml()}
      ${tabsHtml()}
    </div>
    <main>${mainHtml()}</main>
  `;
}

function headerHtml(){
  const titles = {roster:'Team Roster', newgame:'New Match Roster', saved:'Saved Rosters', live:'Live Game'};
  const eyebrow = State.settings.teamName ? State.settings.teamName.toUpperCase() : 'MATCH DAY';
  return `
    <header class="topbar">
      <div class="eyebrow">${eyebrow}</div>
      <h1>${titles[State.tab]}</h1>
    </header>
  `;
}

function tabsHtml(){
  if(State.tab==='live') return '';
  const tabs = [ ['roster','Roster'], ['newgame','New Game'], ['saved','Saved'] ];
  return `<nav class="tabs">${tabs.map(([k,label])=>
    `<button class="${State.tab===k?'active':''}" onclick="setTab('${k}')">${label}</button>`
  ).join('')}</nav>`;
}

function mainHtml(){
  if(State.tab==='roster') return rosterViewHtml();
  if(State.tab==='newgame') return newGameViewHtml();
  if(State.tab==='saved') return savedViewHtml();
  if(State.tab==='live') return liveGameViewHtml();
  return '';
}

/* ----- Roster tab ----- */
function rosterViewHtml(){
  return `
    <div class="card">
      <h2>Team Settings</h2>
      <label class="field-label">Team Name</label>
      <input type="text" value="${State.settings.teamName||''}" placeholder="e.g. Blue Dragons" maxlength="30" onchange="updateTeamName(this.value)">
      <div style="height:14px;"></div>
      <label class="field-label">Color Theme</label>
      <div class="theme-row">
        ${Object.entries(THEMES).map(([key,t])=>`
          <button class="theme-swatch ${State.settings.theme===key?'selected':''}" style="background:${t.pitch};" onclick="setTheme('${key}')" aria-label="${t.name}"></button>
        `).join('')}
      </div>
    </div>
    <div class="card">
      <h2>Add a Player</h2>
      <div class="row">
        <input type="text" id="newPlayerInput" placeholder="First name" maxlength="24" style="flex:3;">
        <input type="text" id="newPlayerLastInitial" placeholder="Last initial" maxlength="1" style="flex:1;text-align:center;text-transform:uppercase;">
        <button class="btn" onclick="addPlayer()">Add</button>
      </div>
      <p class="muted" style="margin-top:6px;">Last initial helps tell kids with similar first names apart on the field diagram.</p>
      <p class="muted" style="margin-top:8px;">${State.players.length} player${State.players.length===1?'':'s'} on the roster.</p>
    </div>
    <div class="card">
      <h2>Players</h2>
      ${State.players.length===0 ? `<p class="muted">No players yet — add your first player above.</p>` :
        State.players.map(p=>`
          <div class="player-chip">
            <span class="name">${playerName(p.id)}</span>
            <button class="btn danger" onclick="removePlayer('${p.id}')">Remove</button>
          </div>
        `).join('')
      }
    </div>
  `;
}

function updateTeamName(val){
  State.settings.teamName = val.trim();
  saveSettings(State.settings);
  render();
}
function setTheme(key){
  State.settings.theme = key;
  saveSettings(State.settings);
  applyTheme(key);
  render();
}

function addPlayer(){
  const input = document.getElementById('newPlayerInput');
  const liInput = document.getElementById('newPlayerLastInitial');
  const name = input.value.trim();
  const lastInitial = liInput.value.trim().slice(0,1);
  if(!name) return;
  State.players.push({id: uid(), name, lastInitial});
  saveRoster(State.players);
  render();
  showToast(name + (lastInitial? ' '+lastInitial.toUpperCase()+'.' : '') + ' added to roster');
}
function removePlayer(id){
  const p = State.players.find(p=>p.id===id);
  if(!confirm('Remove ' + (p?p.name:'this player') + ' from the roster?')) return;
  State.players = State.players.filter(p=>p.id!==id);
  saveRoster(State.players);
  render();
}

/* ----- New Game tab ----- */
function ensureDraft(){
  if(!State.draft){
    State.draft = {
      date: new Date().toISOString().slice(0,10),
      opponent: '',
      presentIds: State.players.map(p=>p.id),
      gkHalf1: State.players[0] ? State.players[0].id : null,
      gkHalf2: State.players[0] ? State.players[0].id : null,
      shiftsPerHalf: 3,
      generated: null,
    };
  }
}

function newGameViewHtml(){
  ensureDraft();
  const d = State.draft;
  if(State.players.length < 7){
    return `<div class="card"><p class="muted">You need at least 7 players on your roster (1 keeper + 6 field) before you can generate a game roster. Add players on the Roster tab.</p></div>`;
  }
  const presentPlayers = State.players.filter(p=> d.presentIds.includes(p.id));

  let body = `
    <div class="card">
      <h2>Game Details</h2>
      <label class="field-label">Game Date</label>
      <input type="date" value="${d.date}" onchange="updateDraft('date', this.value)">
      <div style="height:12px;"></div>
      <label class="field-label">Opponent</label>
      <input type="text" value="${d.opponent||''}" placeholder="e.g. Green Dragons" maxlength="40" onchange="updateDraft('opponent', this.value)">
    </div>

    <div class="card">
      <h2>Who's Here Today?</h2>
      ${State.players.map(p=>`
        <div class="attend-row">
          <span class="name" style="font-weight:600;">${playerName(p.id)}</span>
          <div class="toggle ${d.presentIds.includes(p.id)?'on':''}" onclick="togglePresent('${p.id}')">
            <div class="knob"></div>
          </div>
        </div>
      `).join('')}
      <p class="muted" style="margin-top:8px;">${presentPlayers.length} present today.</p>
    </div>
  `;

  if(presentPlayers.length < 7){
    body += `<div class="warn-banner">Need at least 7 present players (1 keeper + 6 field) to generate a roster.</div>`;
  } else {
    body += `
      <div class="card">
        <h2>Goalkeepers</h2>
        <label class="field-label">1st Half Keeper</label>
        <select onchange="updateDraft('gkHalf1', this.value)">
          ${presentPlayers.map(p=>`<option value="${p.id}" ${d.gkHalf1===p.id?'selected':''}>${playerName(p.id)}</option>`).join('')}
        </select>
        <div style="height:12px;"></div>
        <label class="field-label">2nd Half Keeper</label>
        <select onchange="updateDraft('gkHalf2', this.value)">
          ${presentPlayers.map(p=>`<option value="${p.id}" ${d.gkHalf2===p.id?'selected':''}>${playerName(p.id)}</option>`).join('')}
        </select>
      </div>

      <div class="card">
        <h2>Shifts Per Half</h2>
        <p class="muted" style="margin-top:-4px;margin-bottom:10px;">More shifts = more frequent rotation and shorter stretches on field.</p>
        <div class="stepper">
          <button onclick="updateDraft('shiftsPerHalf', ${Math.max(2,d.shiftsPerHalf-1)})">−</button>
          <span class="val">${d.shiftsPerHalf}</span>
          <button onclick="updateDraft('shiftsPerHalf', ${Math.min(5,d.shiftsPerHalf+1)})">+</button>
        </div>
      </div>

      <button class="btn gold full" style="padding:14px;font-size:15px;" onclick="generateDraft()">Generate Roster</button>
    `;
  }

  if(d.generated){
    body += `<div style="height:18px;"></div>` + generatedRosterHtml(d.generated, d.presentIds, d.gkHalf1, d.gkHalf2, true, d.date, d.opponent) +
      `<button class="btn full" style="margin-top:14px;" onclick="saveDraftGame()">Save This Roster</button>`;
  }

  return body;
}

function updateDraft(key, val){
  ensureDraft();
  if(key==='shiftsPerHalf') val = parseInt(val,10);
  State.draft[key] = val;
  if(key!=='opponent') State.draft.generated = null;
  render();
}
function togglePresent(id){
  ensureDraft();
  const d = State.draft;
  if(d.presentIds.includes(id)) d.presentIds = d.presentIds.filter(x=>x!==id);
  else d.presentIds.push(id);
  if(!d.presentIds.includes(d.gkHalf1)) d.gkHalf1 = d.presentIds[0] || null;
  if(!d.presentIds.includes(d.gkHalf2)) d.gkHalf2 = d.presentIds[0] || null;
  d.generated = null;
  render();
}
function generateDraft(){
  const d = State.draft;
  d.generated = generateGameSchedule(d.presentIds, d.gkHalf1, d.gkHalf2, d.shiftsPerHalf);
  State.viewingHalf = 0; State.viewingShift = 0; State.swapSelection = null;
  render();
}
async function saveDraftGame(){
  const d = State.draft;
  if(State.games[d.date] && !confirm('A roster for ' + d.date + ' already exists. Overwrite it?')) return;
  State.games[d.date] = {
    date: d.date,
    opponent: d.opponent || '',
    presentIds: d.presentIds,
    gkHalf1: d.gkHalf1,
    gkHalf2: d.gkHalf2,
    shiftsPerHalf: d.shiftsPerHalf,
    halves: d.generated,
  };
  await saveGames(State.games);
  showToast('Roster saved for ' + d.date);
  State.draft = null;
  State.tab = 'saved';
  render();
}

/* ----- Saved tab ----- */
function savedViewHtml(){
  const dates = Object.keys(State.games).sort((a,b)=> b.localeCompare(a));
  if(dates.length===0){
    return `<div class="empty-state"><div class="display">No Saved Rosters</div><p>Generate a roster on the New Game tab and save it to see it here.</p></div>`;
  }
  if(State.activeGameDate && State.games[State.activeGameDate]){
    const g = State.games[State.activeGameDate];
    ensureLiveGame(g);
    const total = computeScore(g.liveGame.goals);
    const hasScore = g.liveGame.goals.length > 0;
    const btnLabel = g.liveGame.finalized ? 'View Saved Game' : (hasScore ? 'Continue Live Scoring' : 'Start Live Game');
    return `
      <button class="btn secondary" style="margin-bottom:12px;" onclick="closeGame()">← All Saved Rosters</button>
      <div class="card">
        <h2>${formatDate(g.date)}</h2>
        <p class="muted">${g.opponent ? ('vs ' + g.opponent + ' · ') : ''}${g.presentIds.length} players present · ${g.shiftsPerHalf} shifts per half</p>
        ${hasScore ? `<p style="font-weight:800;color:var(--pitch-deep);margin-top:8px;">${State.settings.teamName||'Us'} ${total.us} — ${total.opp} ${g.opponent||'Opponent'}${g.liveGame.finalized ? ' <span style="color:var(--pitch);font-weight:700;font-size:12px;">(Final)</span>' : ''}</p>` : ''}
        <button class="btn gold full" style="margin-top:12px;" onclick="openLiveGame('${g.date}')">${btnLabel}</button>
      </div>
      ${generatedRosterHtml(g.halves, g.presentIds, g.gkHalf1, g.gkHalf2, false, g.date, g.opponent)}
      <button class="btn danger" style="margin-top:14px;" onclick="deleteGame('${g.date}')">Delete This Roster</button>
    `;
  }
  return `<div class="card">${dates.map(dt=>{
    const g = State.games[dt];
    ensureLiveGame(g);
    const total = computeScore(g.liveGame.goals);
    const hasScore = g.liveGame.goals.length > 0;
    const scoreTag = hasScore ? (' · '+total.us+'–'+total.opp+(g.liveGame.finalized ? ' Final' : ' (live)')) : '';
    return `<div class="game-list-item" onclick="openGame('${dt}')">
      <div><div class="date">${formatDate(dt)}${g.opponent ? (' — vs '+g.opponent) : ''}</div><div class="sub">${g.presentIds.length} present · ${g.shiftsPerHalf} shifts/half${scoreTag}</div></div>
      <span style="color:var(--slate-light);font-size:18px;">›</span>
    </div>`;
  }).join('')}</div>`;
}
function formatDate(iso){
  const [y,m,dd] = iso.split('-').map(Number);
  const dt = new Date(y, m-1, dd);
  return dt.toLocaleDateString(undefined, {weekday:'short', month:'short', day:'numeric', year:'numeric'});
}
function openGame(date){ State.activeGameDate = date; State.viewingHalf=0; State.viewingShift=0; State.swapSelection=null; render(); }
function closeGame(){ State.activeGameDate = null; render(); }
async function deleteGame(date){
  if(!confirm('Delete the roster for ' + formatDate(date) + '? This cannot be undone.')) return;
  delete State.games[date];
  await saveGames(State.games);
  State.activeGameDate = null;
  render();
}

/* ----- Live Game scoring ----- */
function ensureLiveGame(g){
  if(!g.liveGame) g.liveGame = { goals: [], finalized: false };
  if(g.liveGame.finalized === undefined) g.liveGame.finalized = false;
}
function computeScore(goals, half){
  const list = half ? goals.filter(x=>x.half===half) : goals;
  const us = list.filter(x=> x.type==='us' || x.type==='ownGoal').length;
  const opp = list.filter(x=> x.type==='opponent').length;
  return { us, opp };
}

function openLiveGame(date){
  State.tab = 'live';
  State.activeGameDate = date;
  State.viewingHalf = 0;
  State.viewingShift = 0;
  State.showScorerPicker = false;
  render();
}
function closeLiveGame(){
  State.tab = 'saved';
  State.showScorerPicker = false;
  render();
}
function setLiveHalf(h){ State.viewingHalf = h; State.viewingShift = 0; State.showScorerPicker = false; render(); }
function setLiveShift(i){ State.viewingShift = i; render(); }
function toggleScorerPicker(){ State.showScorerPicker = !State.showScorerPicker; render(); }

async function finalizeGame(){
  const g = State.games[State.activeGameDate];
  if(!g) return;
  ensureLiveGame(g);
  g.liveGame.finalized = true;
  await saveGames(State.games);
  showToast('Game saved');
  closeLiveGame();
}
async function editGame(){
  const g = State.games[State.activeGameDate];
  if(!g) return;
  ensureLiveGame(g);
  g.liveGame.finalized = false;
  await saveGames(State.games);
  render();
}

async function logGoal(type, scorerId){
  const g = State.games[State.activeGameDate];
  if(!g) return;
  ensureLiveGame(g);
  g.liveGame.goals.push({ id: uid(), half: State.viewingHalf+1, type, scorerId: scorerId || null, ts: Date.now() });
  await saveGames(State.games);
  State.showScorerPicker = false;
  render();
  const msg = type==='opponent' ? 'Opponent goal logged'
    : type==='ownGoal' ? 'Own goal — point for ' + (State.settings.teamName || 'us')
    : 'Goal logged for ' + playerName(scorerId);
  showToast(msg);
}
async function deleteGoal(goalId){
  const g = State.games[State.activeGameDate];
  if(!g || !g.liveGame) return;
  g.liveGame.goals = g.liveGame.goals.filter(x=>x.id!==goalId);
  await saveGames(State.games);
  render();
}

function liveGameViewHtml(){
  const g = State.games[State.activeGameDate];
  if(!g){
    return `<div class="empty-state"><div class="display">Game Not Found</div><p>Go back and open a saved roster to start live scoring.</p></div>`;
  }
  ensureLiveGame(g);
  const goals = g.liveGame.goals;
  const total = computeScore(goals);
  const h1 = computeScore(goals, 1);
  const h2 = computeScore(goals, 2);
  const activeHalf = State.viewingHalf;
  const half = g.halves[activeHalf];
  const shift = half.shifts[State.viewingShift];
  const gkId = activeHalf===0 ? g.gkHalf1 : g.gkHalf2;
  const presentPlayers = g.presentIds.map(id=> State.players.find(p=>p.id===id)).filter(Boolean);
  const teamLabel = State.settings.teamName || 'Us';
  const oppLabel = g.opponent || 'Opponent';

  const goalLogHtml = goals.slice().sort((a,b)=>a.ts-b.ts).map(entry=>{
    let label;
    if(entry.type==='us') label = 'H' + entry.half + ' — ' + playerName(entry.scorerId) + ' (' + teamLabel + ')';
    else if(entry.type==='ownGoal') label = 'H' + entry.half + ' — Opponent own goal (' + teamLabel + ')';
    else label = 'H' + entry.half + ' — ' + oppLabel;
    const removeBtn = g.liveGame.finalized ? '' : `<button class="btn danger" onclick="deleteGoal('${entry.id}')">Remove</button>`;
    return `<div class="goal-row"><span>${label}</span>${removeBtn}</div>`;
  }).join('') || `<p class="muted">No goals logged yet.</p>`;

  return `
    <button class="btn secondary" style="margin-bottom:12px;" onclick="closeLiveGame()">← Back to Roster</button>

    <div class="card">
      <h2>${g.opponent ? ('vs ' + g.opponent) : 'Live Game'}</h2>
      <p class="muted">${formatDate(g.date)}${g.liveGame.finalized ? ' · <strong style="color:var(--pitch);">Game Saved</strong>' : ''}</p>
      <div class="score-big">
        <div class="score-side"><div class="score-label">${teamLabel}</div><div class="score-num">${total.us}</div></div>
        <div class="score-sep">–</div>
        <div class="score-side"><div class="score-label">${oppLabel}</div><div class="score-num">${total.opp}</div></div>
      </div>
      <p class="muted" style="text-align:center;margin-top:8px;">Half 1: ${h1.us}–${h1.opp} &nbsp;·&nbsp; Half 2: ${h2.us}–${h2.opp}</p>
      ${g.liveGame.finalized ? `<button class="btn secondary full" style="margin-top:14px;" onclick="editGame()">Edit Game</button>` : ''}
    </div>

    ${g.liveGame.finalized ? '' : `
    <div class="card">
      <h2>Log a Goal — Half ${activeHalf+1}</h2>
      <div class="shift-tabs">
        ${[0,1].map(h=>`<button class="${activeHalf===h?'active':''}" onclick="setLiveHalf(${h})">Half ${h+1}</button>`).join('')}
      </div>
      <div class="row" style="gap:10px;margin-top:10px;">
        <button class="btn full" onclick="toggleScorerPicker()">+ ${teamLabel} Goal</button>
        <button class="btn full secondary" onclick="logGoal('opponent')">+ ${oppLabel} Goal</button>
      </div>
      ${State.showScorerPicker ? `
        <div style="margin-top:12px;">
          <p class="muted" style="margin:0 0 6px;">Who scored?</p>
          <div class="bench-chips">
            ${presentPlayers.map(p=>`<span class="bench-chip" style="cursor:pointer;" onclick="logGoal('us','${p.id}')">${playerName(p.id)}</span>`).join('')}
            <span class="bench-chip" style="cursor:pointer;background:#FCEFE9;color:var(--danger);border-color:#F0C4B0;" onclick="logGoal('ownGoal')">Opponent Own Goal</span>
          </div>
        </div>
      ` : ''}
    </div>
    `}

    <div class="card">
      <h2>On the Field — Half ${activeHalf+1}, Shift ${State.viewingShift+1}</h2>
      <div class="shift-tabs">
        ${half.shifts.map((_,i)=>`<button class="${State.viewingShift===i?'active':''}" onclick="setLiveShift(${i})">Shift ${i+1}</button>`).join('')}
      </div>
      <div class="pitch-wrap">${pitchSvg(shift.assign, false, gkId)}</div>
      <div class="bench-strip">
        <div class="lbl">Bench</div>
        <div class="bench-chips">${shift.benched.map(pid=>`<span class="bench-chip">${playerName(pid)}</span>`).join('')}</div>
      </div>
    </div>

    <div class="card">
      <h2>Goal Log</h2>
      ${goalLogHtml}
    </div>

    ${g.liveGame.finalized ? '' : `<button class="btn gold full" style="padding:14px;font-size:15px;margin-top:4px;" onclick="finalizeGame()">Save Game</button>`}
  `;
}

/* ----- Review tables: shift grid, position totals, balance checks ----- */
const POS_CATEGORY = { D1:'Defender', D2:'Defender', M:'Midfielder', W1:'Wing', W2:'Wing', F:'Forward' };
const POS_ABBR = { Defender:'Def', Midfielder:'Mid', Wing:'Wing', Forward:'Fwd', GK:'GK', Bench:'Bench' };

function computeReviewStats(halves, presentIds, gkHalf1, gkHalf2){
  const columns = [];
  halves.forEach((half,hIdx)=> half.shifts.forEach((_,sIdx)=> columns.push({h:hIdx, s:sIdx, label:'H'+(hIdx+1)+'·'+(sIdx+1)})));

  const grid = {};
  const totals = {};
  presentIds.forEach(pid=>{
    grid[pid] = [];
    totals[pid] = { Defender:0, Midfielder:0, Wing:0, Forward:0, GK:0, Bench:0 };
  });

  halves.forEach((half,hIdx)=>{
    const gkId = hIdx===0 ? gkHalf1 : gkHalf2;
    half.shifts.forEach(shift=>{
      presentIds.forEach(pid=>{
        let cat;
        if(pid===gkId){ cat = 'GK'; }
        else if(shift.benched.includes(pid)){ cat = 'Bench'; }
        else{
          const slotCode = Object.keys(shift.assign).find(code=> shift.assign[code]===pid);
          cat = slotCode ? POS_CATEGORY[slotCode] : null;
        }
        grid[pid].push(cat);
        if(cat) totals[pid][cat] = (totals[pid][cat]||0) + 1;
      });
    });
  });

  const checks = {};
  presentIds.forEach(pid=>{
    const t = totals[pid];
    const fieldTotal = t.Defender + t.Midfielder + t.Wing + t.Forward;
    const totalShifts = fieldTotal + t.GK + t.Bench;
    const maxSingle = Math.max(t.Defender, t.Midfielder, t.Wing, t.Forward);
    const played = totalShifts>0 && (fieldTotal>0 || t.GK>0);
    const variedPositions = !(fieldTotal>=3 && maxSingle > fieldTotal/2);

    let longestBench = 0, run = 0;
    grid[pid].forEach(cat=>{
      if(cat==='Bench'){ run++; longestBench = Math.max(longestBench, run); }
      else{ run = 0; }
    });
    const benchOk = longestBench < 3;

    checks[pid] = { played, variedPositions, benchOk, maxSingle, fieldTotal, longestBench };
  });

  return { columns, grid, totals, checks };
}

function reviewTablesHtml(halves, presentIds, gkHalf1, gkHalf2){
  const { columns, grid, totals, checks } = computeReviewStats(halves, presentIds, gkHalf1, gkHalf2);

  const gridRows = presentIds.map(pid=>`
    <tr>
      <td class="rt-name">${playerName(pid)}</td>
      ${grid[pid].map(cat=>`<td>${cat ? POS_ABBR[cat] : '<span style="color:var(--danger);font-weight:800;">!</span>'}</td>`).join('')}
    </tr>
  `).join('');

  const totalsRows = presentIds.map(pid=>{
    const t = totals[pid];
    const sum = t.Defender+t.Midfielder+t.Wing+t.Forward+t.GK+t.Bench;
    return `
      <tr>
        <td class="rt-name">${playerName(pid)}</td>
        <td>${t.Defender}</td><td>${t.Midfielder}</td><td>${t.Wing}</td><td>${t.Forward}</td><td>${t.GK}</td><td>${t.Bench}</td>
        <td style="font-weight:800;">${sum}</td>
      </tr>
    `;
  }).join('');

  const checkRows = presentIds.map(pid=>{
    const c = checks[pid];
    const cell = (ok, type) => ok
      ? '<span style="color:#1B7A43;">✓</span>'
      : `<span style="color:var(--danger);font-weight:800;">REVIEW</span><br>
         <button class="btn secondary" style="padding:4px 9px;font-size:11px;margin-top:4px;" onclick="fixPlayer('${pid}','${type}')">Fix</button>`;
    return `
      <tr>
        <td class="rt-name">${playerName(pid)}</td>
        <td>${cell(c.played,'played')}</td>
        <td>${cell(c.variedPositions,'variety')}</td>
        <td>${cell(c.benchOk,'bench')}</td>
      </tr>
    `;
  }).join('');

  return `
    <div class="card" style="margin-top:18px;">
      <h2>Shift-by-Shift Grid</h2>
      <p class="muted" style="margin-top:-6px;">Every cell should show a position or Bench — a red ! means someone was missed.</p>
      <div class="rt-scroll">
        <table class="rt-table">
          <thead><tr><th class="rt-name">Player</th>${columns.map(c=>`<th>${c.label}</th>`).join('')}</tr></thead>
          <tbody>${gridRows}</tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <h2>Position Totals</h2>
      <p class="muted" style="margin-top:-6px;">Shift counts per position, this game. Totals should match across players.</p>
      <div class="rt-scroll">
        <table class="rt-table">
          <thead><tr><th class="rt-name">Player</th><th>Def</th><th>Mid</th><th>Wing</th><th>Fwd</th><th>GK</th><th>Bench</th><th>Total</th></tr></thead>
          <tbody>${totalsRows}</tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <h2>Balance Checks</h2>
      <p class="muted" style="margin-top:-6px;line-height:1.5;">
        <strong>Played</strong>: got on the field or in goal at least once.
        <strong>Variety</strong>: no single position took over half their field shifts.
        <strong>Bench</strong>: never sat 3+ shifts in a row.
      </p>
      <div class="rt-scroll">
        <table class="rt-table">
          <thead><tr><th class="rt-name">Player</th><th>Played</th><th>Variety</th><th>Bench</th></tr></thead>
          <tbody>${checkRows}</tbody>
        </table>
      </div>
    </div>
  `;
}

function pitchSvg(assign, editable, gkId){
  // simple 2-2-1 layout coordinates on a 100x140 viewbox pitch
  const coords = {
    D1: [27, 100], D2: [73, 100],
    M:  [50, 72],
    W1: [17, 42], W2: [83, 42],
    F:  [50, 18],
  };
  let circles = '';
  POSITION_SLOTS.forEach(slot=>{
    const [x,y] = coords[slot.code];
    const pid = assign[slot.code];
    const sel = State.swapSelection && State.swapSelection.type==='field' && State.swapSelection.slot===slot.code;
    circles += `
      <g ${editable?`onclick="selectSwap('field','${slot.code}')"`:''} style="cursor:${editable?'pointer':'default'};">
        <rect x="${x-17}" y="${y-8.5}" width="34" height="17" rx="6" fill="${sel? '#FFF4CF':'var(--chalk,#F5F7F2)'}" stroke="${sel?'#E8B923':'#12312A'}" stroke-width="${sel?'1.6':'0.8'}"/>
        <text x="${x}" y="${y-1}" text-anchor="middle" class="bubble-name">${pitchDisplayLabel(pid)}</text>
        <text x="${x}" y="${y+5.5}" text-anchor="middle" class="bubble-pos-sm">${slot.short}</text>
      </g>
    `;
  });
  return `
    <svg viewBox="0 0 100 140" xmlns="http://www.w3.org/2000/svg">
      <rect x="2" y="2" width="96" height="136" fill="none" stroke="#EAF2ED" stroke-width="1" opacity="0.55"/>
      <line x1="2" y1="70" x2="98" y2="70" stroke="#EAF2ED" stroke-width="0.7" opacity="0.4"/>
      <circle cx="50" cy="70" r="10" fill="none" stroke="#EAF2ED" stroke-width="0.7" opacity="0.4"/>
      <rect x="25" y="2" width="50" height="16" fill="none" stroke="#EAF2ED" stroke-width="0.7" opacity="0.4"/>
      <rect x="25" y="122" width="50" height="16" fill="none" stroke="#EAF2ED" stroke-width="0.7" opacity="0.4"/>
      ${circles}
      <g>
        <rect x="33" y="123" width="34" height="17" rx="6" fill="var(--gold,#E8B923)" stroke="#12312A" stroke-width="0.8"/>
        <text x="50" y="129.5" text-anchor="middle" class="bubble-name" style="fill:#12312A;">${pitchDisplayLabel(gkId)}</text>
        <text x="50" y="136" text-anchor="middle" class="bubble-pos-sm" style="fill:#12312A;">GK</text>
      </g>
    </svg>
  `;
}
function exportRosterPDF(){
  try{
    const data = window.__pdfExportData;
    if(!data || typeof window.jspdf === 'undefined'){
      showToast('PDF export isn\'t ready yet — wait a second and try again.');
      return;
    }
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    const dateLabel = data.gameDate ? formatDate(data.gameDate) : 'Untitled Game';
    const gkByHalf = [data.gkHalf1, data.gkHalf2];
    const colHeaders = ['Shift','Def','Def','Mid','Wing','Wing','Fwd','Bench'];
    const colX =       [14,     22,   40,   58,   76,    94,   112,  130];
    const colWidth =    18;
    const benchWidth =  62;

    let y = 18;
    if(data.teamName){
      doc.setFontSize(11);
      doc.text(data.teamName.toUpperCase(), 14, y);
      y += 6;
    }
    doc.setFontSize(16);
    doc.text('Match Day Roster', 14, y);
    y += 7;
    doc.setFontSize(11);
    doc.text(dateLabel + (data.opponent ? ('  —  vs ' + data.opponent) : ''), 14, y);
    y += 10;

    data.halves.forEach((half, hIdx)=>{
      if(y > 260){ doc.addPage(); y = 18; }
      doc.setFontSize(12);
      doc.text('Half ' + (hIdx+1) + '  —  Keeper: ' + playerName(gkByHalf[hIdx]), 14, y);
      y += 6;

      doc.setFontSize(8);
      colHeaders.forEach((h,i)=> doc.text(h, colX[i], y));
      y += 1.5;
      doc.setLineWidth(0.2);
      doc.line(14, y, 192, y);
      y += 4;

      half.shifts.forEach((shift, sIdx)=>{
        const rowVals = [
          String(sIdx+1),
          playerName(shift.assign.D1),
          playerName(shift.assign.D2),
          playerName(shift.assign.M),
          playerName(shift.assign.W1),
          playerName(shift.assign.W2),
          playerName(shift.assign.F),
          shift.benched.map(pid=>playerName(pid)).join(', ') || '—',
        ];
        const wrapped = rowVals.map((val,i)=> doc.splitTextToSize(val, i===7 ? benchWidth : colWidth));
        const lineCount = Math.max.apply(null, wrapped.map(w=>w.length));
        const rowHeight = Math.max(6, lineCount*3.6 + 1.5);

        if(y + rowHeight > 280){ doc.addPage(); y = 18; }
        wrapped.forEach((lines,i)=> doc.text(lines, colX[i], y));
        y += rowHeight;
      });
      y += 8;
    });

    doc.save('roster-' + (data.gameDate || 'game') + '.pdf');
  }catch(err){
    console.error(err);
    showToast('Could not create the PDF — please try again.');
  }
}

function setHalf(h){ State.viewingHalf=h; State.viewingShift=0; State.swapSelection=null; render(); }
function setShift(i){ State.viewingShift=i; State.swapSelection=null; render(); }

function currentGameContext(){
  if(State.tab==='newgame' && State.draft){
    return { presentIds: State.draft.presentIds, gkHalf1: State.draft.gkHalf1, gkHalf2: State.draft.gkHalf2 };
  }
  if(State.tab==='saved' && State.activeGameDate){
    const g = State.games[State.activeGameDate];
    return { presentIds: g.presentIds, gkHalf1: g.gkHalf1, gkHalf2: g.gkHalf2 };
  }
  return null;
}

/* Swap pid out of their most-overused position and into their most-underused
   one, trading places with whoever's in that shift playing the target
   position. Touches exactly one shift, two players. */
function fixVariety(pid, halves, ctx){
  const CAT4 = ['Defender','Midfielder','Wing','Forward'];
  const stats = computeReviewStats(halves, ctx.presentIds, ctx.gkHalf1, ctx.gkHalf2);
  const t = stats.totals[pid];
  const overCat = CAT4.reduce((a,b)=> t[b]>t[a] ? b : a, CAT4[0]);
  const underCat = CAT4.reduce((a,b)=> t[b]<t[a] ? b : a, CAT4[0]);
  if(overCat === underCat) return null;

  for(let hIdx=0; hIdx<halves.length; hIdx++){
    const half = halves[hIdx];
    for(let sIdx=0; sIdx<half.shifts.length; sIdx++){
      const shift = half.shifts[sIdx];
      const pidCode = Object.keys(shift.assign).find(code=> shift.assign[code]===pid);
      if(!pidCode || POS_CATEGORY[pidCode] !== overCat) continue;
      const partnerCode = Object.keys(shift.assign).find(code=> POS_CATEGORY[code]===underCat && shift.assign[code]!==pid);
      if(!partnerCode) continue;
      const partnerId = shift.assign[partnerCode];
      shift.assign[pidCode] = partnerId;
      shift.assign[partnerCode] = pid;
      return { hIdx, sIdx };
    }
  }
  return null;
}

/* Break up pid's longest bench streak by swapping them onto the field in the
   middle of that streak, trading with whoever in that shift has played the
   most field time so far (giving that player a fair breather). */
function fixBenchStreak(pid, halves, ctx){
  const timeline = [];
  halves.forEach((half,hIdx)=> half.shifts.forEach((shift,sIdx)=> timeline.push({hIdx,sIdx,shift})));

  let run = [], bestRun = [];
  timeline.forEach(item=>{
    if(item.shift.benched.includes(pid)){ run.push(item); if(run.length>bestRun.length) bestRun = run.slice(); }
    else run = [];
  });
  if(bestRun.length < 3) return null;

  const target = bestRun[Math.floor(bestRun.length/2)];
  const shift = target.shift;
  const stats = computeReviewStats(halves, ctx.presentIds, ctx.gkHalf1, ctx.gkHalf2);
  const codes = Object.keys(shift.assign);
  if(!codes.length) return null;

  codes.sort((a,b)=>{
    const fa = stats.totals[shift.assign[a]], fb = stats.totals[shift.assign[b]];
    const fieldA = fa.Defender+fa.Midfielder+fa.Wing+fa.Forward;
    const fieldB = fb.Defender+fb.Midfielder+fb.Wing+fb.Forward;
    return fieldB - fieldA;
  });
  const swapCode = codes[0];
  const partnerId = shift.assign[swapCode];
  shift.assign[swapCode] = pid;
  const benchIdx = shift.benched.indexOf(pid);
  shift.benched[benchIdx] = partnerId;
  return { hIdx: target.hIdx, sIdx: target.sIdx };
}

async function fixPlayer(pid, type){
  const halves = currentHalves();
  const ctx = currentGameContext();
  if(!halves || !ctx) return;

  const result = type==='variety' ? fixVariety(pid, halves, ctx) : fixBenchStreak(pid, halves, ctx);

  if(result){
    if(State.tab==='saved' && State.activeGameDate){ await saveGames(State.games); }
    State.viewingHalf = result.hIdx;
    State.viewingShift = result.sIdx;
    State.swapSelection = null;
    render();
    showToast('Adjusted ' + playerName(pid) + '\'s rotation');
  } else {
    showToast('No clean swap found — try a manual swap on the pitch instead.');
  }
}
function currentHalves(){
  if(State.tab==='newgame') return State.draft.generated;
  if(State.tab==='saved' && State.activeGameDate) return State.games[State.activeGameDate].halves;
  return null;
}
function selectSwap(type, key){
  if(!State.swapSelection){
    State.swapSelection = {type, slot: type==='field'?key:null, pid: type==='bench'?key:null};
    render();
    return;
  }
  const halves = currentHalves();
  const shift = halves[State.viewingHalf].shifts[State.viewingShift];
  const a = State.swapSelection;
  const b = {type, slot: type==='field'?key:null, pid: type==='bench'?key:null};

  function getPid(sel){ return sel.type==='field' ? shift.assign[sel.slot] : sel.pid; }
  function setPid(sel, pid){
    if(sel.type==='field') shift.assign[sel.slot] = pid;
    else {
      const idx = shift.benched.indexOf(sel.pid);
      if(idx>=0) shift.benched[idx] = pid;
    }
  }
  const pidA = getPid(a);
  const pidB = getPid(b);
  setPid(a, pidB);
  setPid(b, pidA);

  State.swapSelection = null;
  render();
}

function setTab(t){ State.tab = t; State.swapSelection=null; render(); }

/* ---------- Init ---------- */
async function init(){
  State.players = await loadRoster();
  State.games = await loadGames();
  State.settings = await loadSettings();
  applyTheme(State.settings.theme);
  State.loaded = true;
  render();
}
init();
